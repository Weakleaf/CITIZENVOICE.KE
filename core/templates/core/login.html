<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CitizenVoice KE</title>
</head>
<body>
    <main>
        <h1>CitizenVoice KE</h1>
        <h2>Sign in</h2>
        <p>Sign in to access your account.</p>

        {% if form.errors %}
            <p role="alert">The username or password you entered is incorrect.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
