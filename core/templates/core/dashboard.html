<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | CitizenVoice KE</title>
</head>
<body>
    <main>
        <h1>CitizenVoice KE</h1>
        <h2>Welcome, {{ request.user.username }}</h2>
        <p>You are signed in. We’ll build out this dashboard in a later step.</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sign out</button>
        </form>
    </main>
</body>
</html>
